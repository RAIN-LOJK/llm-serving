# W45-0011 · E4b 可选（continuous / B=8 / mixed / packed prefill）
# W4.5 口径见 ROADMAP.md §5 W4.5。复制 W3-0011 的 trace，两臂都加 packed prefill；
# 只报不判。若 continuous 优势 <1.2× 或 TTFT p99 变差，记负结果/边界。
# 运行：python -m bench.run --config configs/experiments/W45/0011-continuous-b8-mixed.toml

schema = 1

[exp]
id = "W45-0011"
stage = "W45"
type = "scenario"
slug = "continuous-b8-mixed"
title = "E4b（可选）continuous / B=8 / mixed / packed prefill"
hypothesis = ["packed_prefill_does_not_dilute_continuous_batching_advantage"]
seed = 0

[[models]]
name = "Qwen/Qwen3-0.6B"
revision = "c1899de289a04d12100db370d81485cdf75e47ca"
dtype = "bfloat16"
trust_remote_code = false

[workload]
kind = "prompts"
prompts = "bench/prompts.json"
max_new_tokens = 128
arrival = "poisson"
rate = 11.0
requests = 128
budgets = [16, 32, 64, 128]
batch_sizes = [1]

[scheduler]
policy = "continuous"

[engine]
impl = "continuous"
device = "cuda"
max_batch = 8
prefill = "packed"
max_prefill_tokens = 8192

[baseline]
run_id = "W45-0010"

[measure]
warmup = 3
repeats = 5
timer = "auto"
memory = ["torch_peak", "driver"]

[accept]
mode = "record_only"
criteria = []
