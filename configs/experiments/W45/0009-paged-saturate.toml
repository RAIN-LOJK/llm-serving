# W45-0009 · E4 端到端（paged）：W4 trace / packed prefill + Triton decode / 800 块
# W4.5 口径见 ROADMAP.md §5 W4.5。复制 W4-0009 的 workload 与 800 块预算，
# 只把 prefill 换成 packed、decode 换成 Triton block-table；与 W45-0008 同 trace。
# 运行：python -m bench.run --config configs/experiments/W45/0009-paged-saturate.toml
#
# 门禁：两臂 saturated=true；paged tok/s ≥ seat；kv_total ≤1640 MiB；
# gather_read_mb / gather_write_mb = 0。token 一致率只作诊断：开放负载下两臂的
# packed group 组成不同（seat B=9 / paged B=64），FA2 的 bf16 归约顺序随组大小变化，
# near-tie 会翻转 greedy id；精确一致性由 E0 golden 与 E2（同组、同 workload）判，
# 不在本 run 当门禁。若不过：先查 Triton step_ms、packed group 大小、workspace 峰值；
# 不调参掩盖。

schema = 1

[exp]
id = "W45-0009"
stage = "W45"
type = "scenario"
slug = "paged-saturate"
title = "E4 端到端（paged）：W4 trace / packed prefill + Triton decode / 800 块"
hypothesis = ["packed_prefill_and_triton_decode_beat_seat_at_equal_budget"]
seed = 0

[[models]]
name = "Qwen/Qwen3-0.6B"
revision = "c1899de289a04d12100db370d81485cdf75e47ca"
dtype = "bfloat16"
trust_remote_code = false

[workload]
kind = "prompts"
prompts = "bench/prompts.json"
max_new_tokens = 128
arrival = "poisson"
rate = 30.0
requests = 128
budgets = [16, 32, 64, 128]
shuffle = false

[scheduler]
policy = "continuous"

[engine]
impl = "paged"
device = "cuda"
max_batch = 64
block_size = 16
kv_blocks = 800
prefill = "packed"
max_prefill_tokens = 8192
decode = "triton"

[baseline]
run_id = "W45-0008"

[measure]
warmup = 1
repeats = 3
timer = "auto"
memory = ["torch_peak", "driver"]

[accept]
# E4 的跨调度器 token 一致率只作诊断：两臂 packed group 组成不同，bf16 near-tie
# 会翻转 greedy id；D7 把精确一致性门禁限定在 E0 golden 与 E2 同组对照。
mode = "record_only"
criteria = []
