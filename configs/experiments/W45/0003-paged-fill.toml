# HISTORICAL control-arm config · 历史控制臂配置：serial prefill 臂已删除，本配置不可再运行；
# 旧代码见 git 历史，测量结果保留在 results/W45/；下面的测量意图不改写。
# W45-0003 · E1 容量（paged 臂）：W3-like / fill / 800 块 / serial prefill
# W4.5 口径见 ROADMAP.md §5 W4.5。与 W45-0002 同 trace、同 1640 MiB 总预算；
# 两臂只差 [engine]（impl / 块几何）。E1 不 decode，显式 decode="gather"，
# 避免把 Triton 的首次 JIT 算进一个不从 decode 读数的容量 probe。
# 运行：python -m bench.run --config configs/experiments/W45/0003-paged-fill.toml
#
# 门禁：peak_concurrency 28 条、capacity_speedup_min ≥1.50、fragmentation_max ≤0.05、
# kv_total ≤1640 MiB；不过就停，先查 allocator。

schema = 1

[exp]
id = "W45-0003"
stage = "W45"
type = "fill"
slug = "paged-fill"
title = "E1 容量（paged）：W3-like / fill-only / 800 块 / serial"
hypothesis = ["paged_capacity_unchanged_at_equal_budget"]
seed = 0

[[models]]
name = "Qwen/Qwen3-0.6B"
revision = "c1899de289a04d12100db370d81485cdf75e47ca"
dtype = "bfloat16"
trust_remote_code = false

[workload]
kind = "prompts"
prompts = "bench/prompts.json"
max_new_tokens = 128
arrival = "closed"
requests = 32
budgets = [16, 32, 64, 128]
batch_sizes = [1]

[scheduler]
policy = "continuous"

[engine]
impl = "paged"
device = "cuda"
max_batch = 64
block_size = 16
kv_blocks = 800
prefill = "serial"
max_prefill_tokens = 8192
decode = "gather"

[baseline]
run_id = "W45-0002"

[measure]
warmup = 1
repeats = 3
timer = "auto"
memory = ["torch_peak", "driver"]

[accept]
mode = "threshold"
criteria = ["capacity_speedup_min"]   # C2 frag is judged on E2 (W45-0005), not a fill run
