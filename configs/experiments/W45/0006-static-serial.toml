# HISTORICAL control-arm config · 历史控制臂配置：serial prefill 臂已删除，本配置不可再运行；
# 旧代码见 git 历史，测量结果保留在 results/W45/；下面的测量意图不改写。
# W45-0006 · E3 prefill 打包（serial 臂）：static B=8 mixed / 1 token
# W4.5 口径见 ROADMAP.md §5 W4.5。这是 E3 的 A/B 控制臂：同一组 prompt、
# 同一 varlen 后端，但调度器逐个 prefill（prefill="serial"）。
# 运行：python -m bench.run --config configs/experiments/W45/0006-static-serial.toml
#
# 8 条 prompt 按 s/m/l 混合锁定；两臂的 prompt_ids 必须逐字相同，
# 否则 prompt_sha256 / trace_sha256 不同，配对判 invalid。
# max_new_tokens=1 + budgets=[1]：只量首 token（TTFT），不把 decode 混进比较。
# 门禁：本臂只做基线；0007 的 packed_prefill_ttft_p99_speedup_min / p50_ratio_max。

schema = 1

[exp]
id = "W45-0006"
stage = "W45"
type = "scenario"
slug = "static-serial-prefill"
title = "E3 prefill A/B（serial）：static B=8 mixed / 1 token"
hypothesis = ["serial_prefill_is_the_ttft_baseline_for_packing"]
seed = 0

[[models]]
name = "Qwen/Qwen3-0.6B"
revision = "c1899de289a04d12100db370d81485cdf75e47ca"
dtype = "bfloat16"
trust_remote_code = false

[workload]
kind = "prompts"
prompts = "bench/prompts.json"
prompt_ids = ["s01", "s05", "m01", "m04", "m08", "l01", "l03", "l05"]
max_new_tokens = 1
arrival = "closed"
requests = 8
budgets = [1]
batch_sizes = [1]

[scheduler]
policy = "static"

[engine]
impl = "continuous"
device = "cuda"
max_batch = 8
prefill = "serial"
max_prefill_tokens = 8192

[measure]
warmup = 1
repeats = 3
timer = "auto"
memory = ["torch_peak", "driver"]

[accept]
mode = "record_only"
criteria = []
