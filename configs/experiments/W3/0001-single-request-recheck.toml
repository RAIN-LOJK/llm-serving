# W3-0001 · E0a 重构无害性：同样单请求路径，四条判据对齐 W2-0007
# W3 矩阵见 docs/w3-plan.md §3；口径见 docs/decisions.md D5。
# 运行：python -m bench.run --config configs/experiments/W3/0001-single-request-recheck.toml

schema = 1

[exp]
id = "W3-0001"
stage = "W3"
type = "microbench"
slug = "single-request-recheck"
title = "E0a 重构无害性：席位 API 落地后单请求路径不动数字"
hypothesis = ["seat_api_does_not_move_w2_numbers"]
seed = 0

[[models]]
name = "Qwen/Qwen3-0.6B"
revision = "c1899de289a04d12100db370d81485cdf75e47ca"
dtype = "bfloat16"
trust_remote_code = false

[workload]
kind = "prompts"
prompts = "bench/prompts.json"
max_new_tokens = 128
batch_sizes = [1]
arrival = "closed"

[engine]
impl = "minillm"
device = "cuda"
max_batch = 1

[measure]
warmup = 3
repeats = 5
timer = "auto"
memory = ["torch_peak", "driver"]

[baseline]
run_id = "W2-0007"

[accept]
mode = "threshold"
criteria = ["ttft_cv_max", "tpot_cv_max", "memory_match_ratio", "decode_speed_vs_hf_min"]
