# W3-9001 · smoke：scheduler -> scenario -> summary 的管线是否通（dummy，不出数字）
# 目的只有「跑得通、字段齐、结果落在 /tmp 而不是 results/」。dummy 臂走
# bench/engines/continuous.py 里的确定性替身，权重与 tokenizer 都不加载。
# 运行：
#   python -m bench.run --config configs/experiments/W3/9001-scheduler-smoke.toml \
#     --out /tmp/minillm-w3-smoke --allow-dirty

schema = 1

[exp]
id = "W3-9001"
stage = "W3"
type = "scenario"
slug = "scheduler-smoke"
title = "W3 调度器管线冒烟（dummy / scenario 路径）"
hypothesis = []
seed = 0

[[models]]
name = "dummy"
revision = "0000000000000000000000000000000000000000"   # dummy arm never loads weights

[workload]
kind = "prompts"
prompts = "bench/prompts.json"
max_new_tokens = 8
arrival = "poisson"
rate = 40.0
requests = 16
budgets = [4, 8]
batch_sizes = [1]          # 并发度是 [engine].max_batch，不是这个行标签（P-20）

[scheduler]
policy = "continuous"

[engine]
impl = "continuous"
device = "cpu"
max_batch = 4
vocab_size = 1024
seed = 0

[measure]
warmup = 1
repeats = 2
timer = "perf_counter"
memory = ["torch_peak"]

[accept]
mode = "record_only"
criteria = []
