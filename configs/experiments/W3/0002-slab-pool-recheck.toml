# W3-0002 · E0b slab 池化后单请求复核（只判 memory，TPOT 不判）
# W3 矩阵见 docs/w3-plan.md §3；口径见 docs/decisions.md D5。
# 运行：python -m bench.run --config configs/experiments/W3/0002-slab-pool-recheck.toml
#
# 为什么是 synthetic 1517：W2-0007 实测的最坏上下文就是 1517 token（slab need =
# 1517 + 128 = 1645，按 64 列桶取整到 1664）。冻结 prompt 集的第一条只有 ~20 token，
# 在那个长度下 (weights + kv) / peak 几乎完全由权重决定（KV 只有几 MB），池记账有没有算对
# 在比值上几乎没有区分度；1517 时 KV 预留约 348 MB，池的分子才真正被检验。
#
# 为什么 TPOT 不判：B=1 时池只有一个席位，池路径与 W2 的单请求 slab 路径等价，TPOT 不构成
# 独立判据。它的值只记在 notes.md 里人工和 W2-0007 比对，偏差 <2% 才允许继续往下走 W3。
# 同理故意不写 [baseline]：E0b 不是 TPOT 的配对臂，不拿它去比 W2-0007 的速度。

schema = 1

[exp]
id = "W3-0002"
stage = "W3"
type = "microbench"
slug = "slab-pool-recheck"
title = "E0b slab 池化后单请求复核：kv_mb 记池的总预留"
hypothesis = ["pool_reservation_explains_the_allocator_peak"]
seed = 0

[[models]]
name = "Qwen/Qwen3-0.6B"
revision = "c1899de289a04d12100db370d81485cdf75e47ca"
dtype = "bfloat16"
trust_remote_code = false

[workload]
kind = "synthetic"
context_lengths = [1517]   # W2-0007 的最坏 ctx；池记账在这里才有区分度
max_new_tokens = 128
batch_sizes = [1]          # 并发度是 [engine].max_batch（P-20）
arrival = "closed"
requests = 1
budgets = [128]

[scheduler]
policy = "continuous"

[engine]
impl = "continuous"
device = "cuda"
max_batch = 1

[measure]
warmup = 3
repeats = 5
timer = "auto"
memory = ["torch_peak", "driver"]

[accept]
mode = "threshold"
criteria = ["memory_match_ratio"]
