# W3-9002 · capacity 探针 / B=8 / uniform（服务 W3-0008 与 W3-0009 这一对）
#
# 1) 这是**探针**，不出正式结论，也不占 results/ 的正式序号语义：9xxx 段只为本阶段
#    正式配置提供输入（λ 的初值）。notes.md 照写，但 verdict 仍是 unreviewed。
# 2) capacity = summary.json 的 throughput.req_s.median。取 λ = 2 × capacity（取整）后
#    写进对应的两个正式配置（本文件服务 0008/0009）；成对两臂必须写**完全相同**的
#    rate/requests/budgets/seed，否则 trace_sha256 不同，判据直接判 invalid。
# 3) budget mix 必须与服务对象一致：容量近似与平均输出长度成反比。用 uniform 的容量去
#    定 mixed 的 λ 会让连续臂欠载、队列排空、saturated=false，C1 判 invalid。
# 4) 跑法：python -m bench.run --config configs/experiments/W3/9002-capacity-b8-uniform.toml
#    然后 python scripts/exp_index.py
#
# 注意 closed + impl="continuous" 的校验（bench/run.py）只要求 requests >= max_batch，
# 所以这里写一条**远长于 B** 的 closed trace：所有请求 t=0 已就绪，席位在 trace 排空前一直
# 满，req_s 才是可持续吞吐；只写 requests = B 只有一批波次，req_s = B / makespan 会含最慢
# 请求的尾巴，只是容量的下限。

schema = 1

[exp]
id = "W3-9002"
stage = "W3"
type = "scenario"
slug = "capacity-b8-uniform"
title = "容量探针：B=8 / uniform（定 W3-0008/0009 的 λ）"
hypothesis = ["capacity_probe_sets_the_e2_arrival_rate"]
seed = 0

[[models]]
name = "Qwen/Qwen3-0.6B"
revision = "c1899de289a04d12100db370d81485cdf75e47ca"
dtype = "bfloat16"
trust_remote_code = false

[workload]
kind = "prompts"
prompts = "bench/prompts.json"
max_new_tokens = 128
arrival = "closed"
requests = 64               # >> max_batch：让席位在排空前一直是满的（见文件头）
budgets = [128]
batch_sizes = [1]

[scheduler]
policy = "continuous"

[engine]
impl = "continuous"
device = "cuda"
max_batch = 8

[measure]
warmup = 1
repeats = 3
timer = "auto"
memory = ["torch_peak", "driver"]

[accept]
mode = "record_only"
criteria = []
