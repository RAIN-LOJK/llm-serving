# W3-0010 · E2 static / B=8 / mixed
# W3 口径见 docs/decisions.md D5。
# 运行：python -m bench.run --config configs/experiments/W3/0010-static-b8-mixed.toml

# 混合长度对：预算 {16,32,64,128} 均匀抽样。B 放大；只报比值，不判 C1。
# rate 必须由该 B 的冒烟 capacity 定（rate = 2 x capacity(B)，取整），跑前先填。
# 两臂（同一 B 的 static/continuous 配置）必须写出**完全相同**的 rate/requests/budgets/seed，
# 否则 trace_sha256 不同，判据会判 invalid（D5）。

schema = 1

[exp]
id = "W3-0010"
stage = "W3"
type = "scenario"
slug = "static-b8-mixed"
title = "E2 调度收益：static / B=8 / mixed"
hypothesis = ["continuous_beats_static_only_with_length_heterogeneity"]
seed = 0

[[models]]
name = "Qwen/Qwen3-0.6B"
revision = "c1899de289a04d12100db370d81485cdf75e47ca"
dtype = "bfloat16"
trust_remote_code = false

[workload]
kind = "prompts"
prompts = "bench/prompts.json"
max_new_tokens = 128
arrival = "poisson"
rate = 11.0                # 2 x capacity(B=8, mixed) = 2 x 5.028 req/s, ceil (W3-9003)
requests = 128
budgets = [16, 32, 64, 128]
batch_sizes = [1]

[scheduler]
policy = "static"

[engine]
impl = "continuous"
device = "cuda"
max_batch = 8

[measure]
warmup = 3
repeats = 5
timer = "auto"
memory = ["torch_peak", "driver"]

[accept]
mode = "record_only"
criteria = []
