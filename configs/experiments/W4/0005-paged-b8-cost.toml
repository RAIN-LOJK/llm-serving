# W4-0005 · E2 代价（paged 臂）：8 条最长 / B=8 / budget 128 / 832 块
# W4 口径见 docs/decisions.md D6（plan 已在 W4 收口时删除）。
# 运行：python -m bench.run --config configs/experiments/W4/0005-paged-b8-cost.toml
#
# 用途：plan §4.4 的 E2 paged 臂。与 0004 同一 workload（同 prompt 集 / budget / seed），
# 8 请求 × 1664 上界：ceil(1664/16) = 104 块/请求，plan 取 8×104=832 块（刚好放下，
# 8×103=824 也够）。同并发下多付的 workspace 约 55 MiB，是代价不是收益（C4）。
# 门禁：C4 step_ms ≤1.15× 健康、>1.5× 撤回吞吐结论；C2 internal frag ≤5%
# （fragmentation_max；求值器读 summary.capacity.frag_internal / memory.frag_internal）。
#
# 选 prompt 的规则：E2 用 bench/prompts.json 的 `long` 桶（l01–l08，8 条，实测
# 1051–1549 token），由 [workload].prompt_ids 显式锁定；runner 按该顺序过滤 PromptSet，
# 并把子集写入 prompt_sha256（同时记录 prompt_ids 与原集 hash）。0004/0005 的 workload
# 必须逐字相同（同 prompt 集 / prompt_ids / budget / seed），否则 trace_sha256 不同、
# 配对判 invalid（D5）。

schema = 1

[exp]
id = "W4-0005"
stage = "W4"
type = "scenario"
slug = "paged-b8-cost"
title = "E2 代价（paged）：8 条最长 / B=8 / budget 128 / 832 块"
hypothesis = ["paged_matches_seat_step_cost_at_the_same_lpad"]
seed = 0

[[models]]
name = "Qwen/Qwen3-0.6B"
revision = "c1899de289a04d12100db370d81485cdf75e47ca"
dtype = "bfloat16"
trust_remote_code = false

[workload]
kind = "prompts"
prompts = "bench/prompts.json"
prompt_ids = ["l01", "l02", "l03", "l04", "l05", "l06", "l07", "l08"]   # long 桶，顺序即 trace 顺序
max_new_tokens = 128
arrival = "closed"
requests = 8                     # 与 0004 完全一致
budgets = [128]
batch_sizes = [1]                # 并发度是 [engine].max_batch（P-20）

[scheduler]
policy = "continuous"

[engine]
impl = "paged"
device = "cuda"
max_batch = 8
block_size = 16
kv_blocks = 832                  # 8 × ceil(1664 / 16) = 832

[baseline]
run_id = "W4-0004"

[measure]
warmup = 3
repeats = 5
timer = "auto"
memory = ["torch_peak", "driver"]

[accept]
mode = "threshold"
criteria = ["fragmentation_max"]   # fragmentation_max 在 thresholds.toml [W4.paged]
