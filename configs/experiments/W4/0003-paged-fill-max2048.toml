# W4-0003 · E1 容量（paged 臂）：W3-like max-2048 / fill / B=64 / 800 块
# W4 口径见 docs/decisions.md D6（plan 已在 W4 收口时删除）。
# 运行：python -m bench.run --config configs/experiments/W4/0003-paged-fill-max2048.toml
#
# 用途：plan §4.4 的 E1 paged 臂。只 prefill + 预留（type="fill"），fill 到不能再准入，
# 记 peak_concurrency（allocator capacity）。
#
# kv_blocks=800（**保守取值**，不是预算上限）：800 × 1.75 MiB = 1400 MiB，
# 28 活跃行 × lpad 1600 的 workspace ≈ 195 MiB → 合计 ≈1595 MiB，余 ~45 MiB。
# 预算其实还能放 820 块（29 条，≈1636 MiB），但 plan §8 R5 把「workspace 顶穿预算」
# 列为风险，1 条并发之差对结论无影响，故取 800。
# 门禁：C1 max_concurrency_speedup_min ≥1.50×（baseline = W4-0002，seat 9 行）；
# 并发 = allocator 模拟 ±1；kv_total ≤1640 MiB（超出则下一 run 降 kv_blocks，
# 不静默改预算）。
#
# **0003 与 0002 必须是同一份 workload**：同 seed / rate / requests / budgets / prompts
# （trace_sha256 必须相同），否则容量配对判 invalid（D5）；两臂只差 [engine]。
# C1 由 bench/thresholds.py 读 summary.capacity.peak_concurrency 求值（已接线）。
# fill 运行不 gather，workspace 由附录 C 公式估算（capacity.workspace_estimated=true）；
# 实机跑完后用 notes.md 记录实测的 kv_total_mb。

schema = 1

[exp]
id = "W4-0003"
stage = "W4"
type = "fill"
slug = "paged-fill-max2048"
title = "E1 容量（paged）：W3-like max-2048 / fill-only / 800 块"
hypothesis = ["paged_capacity_beats_seat_under_the_same_total_budget"]
seed = 0

[[models]]
name = "Qwen/Qwen3-0.6B"
revision = "c1899de289a04d12100db370d81485cdf75e47ca"
dtype = "bfloat16"
trust_remote_code = false

[workload]
kind = "prompts"
prompts = "bench/prompts.json"
max_new_tokens = 128
arrival = "closed"         # fill-only：全部请求 t=0 就绪
requests = 32              # 与 0002 完全一致
budgets = [16, 32, 64, 128]
batch_sizes = [1]          # 并发度是 [engine].max_batch（P-20）

[scheduler]
policy = "continuous"

[engine]
impl = "paged"
device = "cuda"
max_batch = 64             # 调度上限，不是显存上限（D6）
block_size = 16
kv_blocks = 800            # 保守：1400 MiB KV + ~195 MiB workspace ≈ 1595 MiB（见文件头）

[baseline]
run_id = "W4-0002"

[measure]
warmup = 1
repeats = 3
timer = "auto"
memory = ["torch_peak", "driver"]

[accept]
mode = "threshold"
criteria = ["max_concurrency_speedup_min"]
