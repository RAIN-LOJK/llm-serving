# W7-0016 · E4b 容量（hybrid paged）：synthetic mixed [512,2k] / fill / 3970 块
# W7 口径见 ROADMAP.md §5 W7 与 docs/hybrid_attention.md §4；D9 见 docs/decisions.md。
# 运行：python -m bench.run --config configs/experiments/W7/0016-e4b-hybrid-paged.toml
#
# E4b 是同 1640 MiB 状态预算下的 mixed-context record-only 配对（不是生产容量线）：
#   linear 48 × 18.6328 = 894.4 MiB
#   KV    3970 × 0.1875 = 744.4 MiB
#   合计 1638.8 MiB ≤ 1640
# 48 个驻留请求在 [512,2048] 上各 24 条：24×33 + 24×129 = 3888 块 ≤ 3970；
# 下一对再要 162 块会超预算，所以预测 peak ≈48。seat 臂 37 行，比值只报不判。
#
# 自包含：revision 已 pin；本文件不引用其它配置。正式 run 必须在干净树执行；
# 本目录只准备配置，不代表任何数字已经测到。

schema = 1

[exp]
id = "W7-0016"
stage = "W7"
type = "fill"
slug = "e4b-hybrid-paged"
title = "E4b 容量（hybrid paged）：synthetic mixed [512,2k] / fill / 3970 块"
hypothesis = ["paged_kv_keeps_a_capacity_edge_over_the_hybrid_seat_baseline"]
seed = 0

[[models]]
