# W7-0013 · E3 交叉点/P2/P3（pure 0.6B）：synthetic [512,2k,8k] / B=8 / 4200 块
# W7 口径见 ROADMAP.md §5 W7 与 docs/hybrid_attention.md §4；D9 见 docs/decisions.md。
# 运行：python -m bench.run --config configs/experiments/W7/0013-e3-pure-b8.toml
# 8k+128 的预留是 ceil(8320/16)=520 块/请求；B=8 最坏 8×520=4160 块，故取 4200，
# 避免准入节流污染 TPOT/P2/P3（E3/E4a 是延迟/机制探针，不是 1640 容量对）。
#
# 自包含：revision 已 pin；本文件不引用其它配置。正式 run 必须在干净树执行；
# 本目录只准备配置，不代表任何数字已经测到。

schema = 1

[exp]
id = "W7-0013"
stage = "W7"
type = "scenario"
slug = "e3-pure-b8"
title = "E3 交叉点/P2/P3（pure 0.6B）：synthetic [512,2k,8k] / B=8 / 4200 块"
hypothesis = ["pure_attention_is_the_paired_baseline_for_the_crossover"]
seed = 0

[[models]]
name = "Qwen/Qwen3-0.6B"
revision = "c1899de289a04d12100db370d81485cdf75e47ca"
dtype = "bfloat16"
trust_remote_code = false

[workload]
kind = "synthetic"
context_lengths = [512, 2048, 8192]
max_new_tokens = 128
arrival = "closed"
requests = 8
budgets = [128]
batch_sizes = [1]
shuffle = false

[scheduler]
policy = "continuous"

[engine]
impl = "paged"
device = "cuda"
max_batch = 8
kv_blocks = 4200
block_size = 16
max_prefill_tokens = 8192

[measure]
warmup = 3
repeats = 5
timer = "auto"
memory = ["torch_peak", "driver"]

[accept]
# record_only：W7 阈值判定在 Step 5 用本 run 的 summary 求值（bench/thresholds.py），
# 不在正式 run 内自证；这样 Step 5 的口径/配对复核不会被 runner 抢先下结论。
# E3 不是容量探针：8k 请求要 520 块，B=8 最坏 8×520=4160 块；4200 块避免准入节流，保证 8k TPOT 不被排队污染（块预算不按 1640 判，只报）。
mode = "record_only"
criteria = []
