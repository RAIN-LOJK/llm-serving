# W2-0003 · attention 路径归因：SDPA 替换手写 attention
# 与 W2-0002 同模型 / 同 prompt / 同 dtype / 同设备 / 同 max_new_tokens；唯一变化是
# 代码版本的 attention 实现（W2-0002 是手写 matmul+mask，当前 HEAD 是 SDPA）。
# 运行：python -m bench.run --config configs/experiments/W2/0003-sdpa-attn.toml
# 目的不是阶段门禁，而是回答：W2-0002 的 long-prefill 1.49x 里有多少是 attention 路径。
# 判据用 record_only；CV/显存只作为 run 质量检查，不新增事后阈值。

schema = 1

[exp]
id = "W2-0003"
stage = "W2"
type = "microbench"
slug = "sdpa-attn"
title = "SDPA attention 路径：long-prefill 归因（对 W2-0002）"
hypothesis = ["attn_path_explains_long_prefill"]
seed = 0

[[models]]
name = "Qwen/Qwen3-0.6B"
revision = "c1899de289a04d12100db370d81485cdf75e47ca"
dtype = "bfloat16"
trust_remote_code = false

[workload]
kind = "prompts"
prompts = "bench/prompts.json"
max_new_tokens = 128
batch_sizes = [1]
arrival = "closed"

[engine]
impl = "minillm"
device = "cuda"
max_batch = 1

[measure]
warmup = 3
repeats = 5
timer = "auto"
memory = ["torch_peak", "driver"]

[baseline]
run_id = "W2-0002"

[accept]
mode = "record_only"
criteria = []
