# W2-9001 · smoke：self engine -> runner 的管线是否通（CPU，不出数字）
# 目的只有“跑得通、字段齐、结果落在 /tmp 而不是 results/”。
# 运行：
#   python -m bench.run --config configs/experiments/W2/9001-smoke.toml \
#     --out /tmp/w2-smoke --allow-dirty

schema = 1

[exp]
id = "W2-9001"
stage = "W2"
type = "smoke"
slug = "smoke"
title = "W2 管线冒烟（CPU / 自实现引擎）"
hypothesis = []
seed = 0

[[models]]
name = "Qwen/Qwen3-0.6B"
revision = "c1899de289a04d12100db370d81485cdf75e47ca"
dtype = "float32"          # CPU 上跑 bf16 没意义；正式数字在 4090 上用 bf16
trust_remote_code = false

[workload]
kind = "synthetic"
context_lengths = [64]
max_new_tokens = 8
batch_sizes = [1]
arrival = "closed"

[engine]
impl = "minillm"
device = "cpu"
max_batch = 1

[measure]
warmup = 1
repeats = 1
timer = "auto"
memory = ["torch_peak", "driver"]

[accept]
mode = "record_only"
