# W2-0001 · HF generate 参考臂（decode 速度的比较基准）
# 同模型 / 同 prompt 集 / 同 max_new_tokens，与 W2-0002 配对。
# 运行：python -m bench.run --config configs/experiments/W2/0001-hf-reference.toml
# 期望：device_class = measure-cuda；TTFT/TPOT 的 CV 应 ≤ 0.10（否则整份重跑）。

schema = 1

[exp]
id = "W2-0001"
stage = "W2"
type = "microbench"
slug = "hf-reference"
title = "HF generate 参考臂：TTFT / TPOT @ 32 prompt × 128 token"
hypothesis = ["decode_speed_vs_hf"]
seed = 0

[[models]]
name = "Qwen/Qwen3-0.6B"
revision = "c1899de289a04d12100db370d81485cdf75e47ca"
dtype = "bfloat16"
trust_remote_code = false

[workload]
kind = "prompts"
prompts = "bench/prompts.json"
max_new_tokens = 128
batch_sizes = [1]          # 真批处理要等 W3 的调度器；这里只有单请求
arrival = "closed"

[engine]
impl = "hf"
device = "cuda"
max_batch = 1

[measure]
warmup = 3
repeats = 5
timer = "auto"             # cuda 上解析成 cuda_event
memory = ["torch_peak", "driver"]

[accept]
mode = "threshold"
criteria = ["ttft_cv_max", "tpot_cv_max", "memory_match_ratio"]
