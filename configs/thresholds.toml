# Central thresholds. Target values live here, not in code or markdown.
# status = "target": from ROADMAP, not yet measured. status = "calibrated": set after W1.
# An experiment references these by name in [accept].criteria; the runner records the
# resolved values in its manifest/summary.

schema = 1
updated = "2026-11-14"
note = "Targets and failure lines from ROADMAP §6/§8. Calibrate once after W1 and record basis_run."

[W1.align]
# Calibrated on 2026-10-23 against tests/golden/qwen3-0-6b/0001.
# Basis: Qwen3-0.6B pins an attention-sink outlier at the first token (|x| ≈ 7.0e3 from
# layer 2 on). In float32 one ulp there is 9.8e-4, so an independent but equivalent
# summation order already differs by 1-2 ulp -- observed max 1.95e-3 over 4 prompts.
# 1e-2 leaves ~5x headroom over that floor and is still ~10x below any wiring error
# (a wrong scale, q_norm order or rope theta shows up at >= 1e-1).
status = "calibrated"
basis_run = "tests/golden/qwen3-0-6b/0001"
greedy_tokens_exact = 64
layer_max_abs_diff = 1e-2
logits_max_abs_diff = 0.05
batch_sizes = [1, 2, 4]

[W2.bench]
# Calibrated 2026-11-01 against W2-0007 (paired arm W2-0005, both on this machine).
# Measured on W2-0007 (sdpa prefill / hand_baddbmm+slab decode, slab released with the request):
# ttft_cv 1.12%, tpot_cv 0.44%, memory 0.992 median (0.979 at the longest context), decode 1.013x.
# The W2-0006 calibration superseded here read 0.957 / 0.859: the slab hand-off fix flattened
# the memory ratio's dependence on context length, so the target is no longer at risk there.
# Targets stay put: they exist to catch drift, and the observed values sit inside them.
# Ratios are only meaningful against an arm measured on the same host: W2-0001's 16.78 ms and
# W2-0003's 1.113x came from a different 4090 instance and are not comparable (see W2-0005).
status = "calibrated"
basis_run = "W2-0007"
# CV is judged inside a length bucket (overall mixes 16..2048 token prompts).
ttft_cv_max = 0.10
tpot_cv_max = 0.10
# (weights + KV) / torch allocator peak, per context, judged on the median context.
# Not judged against the device-level number (torch.cuda.mem_get_info): it includes the CUDA
# context (~0.5 GB at this size) and spans the whole card, which no formula predicts, so the
# target would be unreachable by construction.
# The residual is activation workspace (T^2 attention) -- a property of the implementation,
# so long-context rows are reported next to the median instead of being averaged away.
memory_match_ratio = 0.90
# median over prompts of (baseline TPOT / our TPOT), matched by prompt id.
decode_speed_vs_hf_min = 0.80

[W3.continuous]
# Calibrated 2026-11-03 against W3-0011 (continuous B=8 mixed) vs W3-0010
# (static, same trace 33bc2397... and max_batch=8).
# Measured: C1 2.01x (311.43 / 154.94 tok/s), C2 decomposed pass (max 1.8e-12 ms),
# C3 request-row token_sha256 0 mismatch over 89 (prompt, budget) keys.
# Context: uniform pair W3-0008/0009 = 1.023x (P3 negative result, record-only);
# B=32 mixed pair W3-0012/0013 = 1.606x (record-only, below the 1.8-2.2x P4 band).
# Targets stay put: 1.30 is the pre-registered target; <1.20 is the negative line.
# Do not read the per-prompt TTFT/e2e CV warnings of saturated scenario runs as
# W2's 0.10 latency-CV target: R5 only looks at the trace-level tok_s CV, which
# was 0.11-0.53% here.
status = "calibrated"
basis_run = "W3-0011"
throughput_speedup_min = 1.30
ttft_p99_decomposed = true

[W4.paged]
# Calibrated 2026-11-06 against W4-0003 (capacity; baseline W4-0002) and W4-0005 (frag).
# Measured: C1 3.111x (28 vs 9, 800 blocks, kv_total 1601.97 MiB <= 1640);
# C2 internal frag 0.55% (target 5%); C3 40/40 E2 token ids identical + E0 64/64 golden.
# C4 is record-only and did NOT pass: paged decode step 35.63 ms vs seat 21.32 ms = 1.671x
# (>1.5x withdraws any throughput conclusion). E3 was later run post-hoc at the user's
# request as record-only: pre-fix 0006 seat 333.44 tok/s vs 0008 paged 325.19 = 0.975x
# (0007 820 blocks was over budget and is kept only as an R5 record). After the slot-mapping
# prefill fix, 0009 paged 358.18 vs 0006 seat 333.44 = 1.074x (both saturated; peak 1626.8
# MiB <= 1640). That 0009 result is a post-hoc post-fix experiment and does NOT change C4
# (decode is untouched). The C1 target stays 1.50: calibration records the observed point,
# it does not lower the pre-registered line.
status = "calibrated"
basis_run = "W4-0003"
max_concurrency_speedup_min = 1.50
fragmentation_max = 0.05

[W6.gdn]
# W6 (docs/decisions.md D8; ROADMAP §5 W6): Gated DeltaNet operators + layer + full model.
# Pre-registered before the 0002 fixture existed (2026-11-14), then calibrated on the
# committed fixture without changing a value: the G0 dry run put chunk-vs-recurrent at
# ~1e-7 (about 100x headroom on outputs, 12x on the final state), and the formal fixture
# came in at 0.0 for projections/conv and <=6e-7 for the final state. Do not relax.
status = "calibrated"
calibrated = "2026-11-14"
basis_golden = "tests/golden/qwen35-0-8b/0002"
# recurrent/chunked vs both independent references (HF torch fallback + fla naive).
operator_atol = 1e-5
operator_rtol = 1e-5
# final recurrent state [B, H, K, V].
state_atol = 1e-5
# short conv: prefill-vs-stepwise state and output equivalence.
conv_atol = 1e-6
# same-shape token replacement must leave positions < t bit-identical on CPU fp32.
causal_atol = 0.0
# single-layer stage table vs HF golden, relative to max|ref|.
proj_rel_max = 1e-5
conv_rel_max = 1e-5
norm_rel_max = 1e-5
gdn_out_rel_max = 1e-5
layer_out_rel_max = 1e-4
# full model: per-layer hidden, last-position logits, greedy ids.
layer_hidden_max_abs = 1e-2
full_logits_max_abs = 0.05
greedy_tokens_exact = 64
# full-model prefill vs token-by-token decode through Qwen35State.
decode_prefill_atol = 1e-4

[W7.state]
status = "target"
basis_run = ""
state_estimate_error_max = 0.20

[W7.hybrid]
# W7 pre-registration (docs/w7-plan.md §5.7, docs/decisions.md D9): targets only, no run
# yet. `basis_run` stays empty until the W7 closeout; closeout may only set
# status="calibrated" and fill basis_run, never lower a value.
status = "target"
basis_run = ""
greedy_tokens_exact = 64

# P1 / capacity under the same 1640 MiB state budget (KV blocks + linear state slots +
# workspace); weights are excluded, and the pure arm keeps W4 C1's basis. 512/2k/8k are
# the capacity speedups at those contexts.
p1_state_ratio_8k_min = 5.0
capacity_speedup_512_min = 2.0
capacity_speedup_2k_min = 4.0
capacity_speedup_8k_min = 6.0

# P3 endpoints are 512 -> 8k (32k is recorded but not judged); the memory crossover is
# in prompt tokens, and P2-latency is the hybrid/pure ratio at 512.
memory_crossover_ctx_max = 256
p2_latency_material_ratio = 1.10
hybrid_tpot_growth_max = 1.10
pure_tpot_growth_min = 1.15

[W45.paged]
# W4.5 (docs/decisions.md D7). Targets, not measurements; calibrated 2026-11-06.
# The lines were frozen after the E0/E2 dry run and did **not** change at closeout.
# `capacity_speedup_min` / `fragmentation_max` carry W4's C1/C2 over unchanged (same
# direction as `max_concurrency_speedup_min` / `fragmentation_max`; the alias exists so
# the W4.5 configs can cite their own section).
# Formal evidence: W45-0012 C1 1.040x pass (pre-fix W45-0005 1.203x fail; 1.0 target
# not met); W45-0003 C1 capacity 3.111x; W45-0007 E3 p99 3.760x / p50 0.512x;
# W45-0009 E4 678.59 vs 330.53 tok/s (record-only, both saturated); E4/E4b token
# agreement is diagnostic only.
status = "calibrated"
basis_run = "W45-0012"
# C4: paged block-table decode step_ms / seat decode step_ms at the largest common
# decode-only active bucket (prefill steps excluded; W4 D6's C4 scope).
decode_step_ratio_max = 1.15
# E3: serial / packed TTFT p99 speedup (packed must be faster by the pre-registered line).
packed_prefill_ttft_p99_speedup_min = 1.15
# E3: packed / serial TTFT p50 regression cap (packing may delay the head of the queue).
packed_prefill_ttft_p50_ratio_max = 1.10
# C1: fill-only allocator capacity, ours / baseline, under the same total budget.
capacity_speedup_min = 1.50
# C2: internal frag only (unwritten tail of the last block).
fragmentation_max = 0.05
# E0: exact greedy token-id prefix vs tests/golden (never regenerated by the runner).
golden_token_match_min = 1.0
# C3: per-prompt token_sha256 agreement between paged and seat on the shared prompt ids.
# Evaluated on E2 only (closed, identical packed group). E4's cross-scheduler agreement
# is diagnostic: bf16 near-ties can flip greedy ids when the group composition differs.
paged_vs_seat_token_match_min = 0.999

[W5.layer]
# W5 (docs/w5-plan.md §5, G5): single full-attention layer vs the HF golden, rel per stage.
# Pre-registered before this fixture existed. The formal golden (2026-11-09) came in at
# 0.0 on every stage and the lines were NOT changed: "calibrated" here means the basis is
# now the committed fixture, not that the values were fitted. They must not be relaxed.
# The integration test may point at a draft with MINILLM_W5_GOLDEN for dry runs only.
status = "calibrated"
calibrated = "2026-11-09"
basis_golden = "tests/golden/qwen35-0-8b/0001"
# q_proj / gate: same nn.Linear and weights on both sides. With the golden script's thread
# cap (mirroring tests/conftest.py) this is bit-identical; without it, cross-process BLAS
# reduction order alone showed ~7e-7 rel, which is what this line leaves headroom for.
proj_rel_max = 1e-5
# input_layernorm / q_norm / k_norm: zero-centered RMSNorm in fp32.
norm_rel_max = 1e-5
# q_rope / k_rope: same rotation and table; only the multiply/add order differs.
rope_rel_max = 1e-5
# attn_gated: o_proj input. HF eager softmax vs our SDPA prefill is the only possible
# difference; on CPU fp32 at matched thread counts it is bit-identical.
attn_gated_rel_max = 1e-5
# layer_out: attention diff carried through o_proj + SwiGLU residual.
layer_out_rel_max = 1e-4
# G6: same-shape token replacement must leave positions < t bit-identical on CPU fp32.
causal_atol = 0.0
