# Central thresholds. Target values live here, not in code or markdown.
# status = "target": from ROADMAP, not yet measured. status = "calibrated": set after W1.
# An experiment references these by name in [accept].criteria; the runner records the
# resolved values in its manifest/summary.

schema = 1
updated = "2026-11-01"
note = "Targets and failure lines from ROADMAP §6/§8. Calibrate once after W1 and record basis_run."

[W1.align]
# Calibrated on 2026-10-23 against tests/golden/qwen3-0-6b/0001.
# Basis: Qwen3-0.6B pins an attention-sink outlier at the first token (|x| ≈ 7.0e3 from
# layer 2 on). In float32 one ulp there is 9.8e-4, so an independent but equivalent
# summation order already differs by 1-2 ulp -- observed max 1.95e-3 over 4 prompts.
# 1e-2 leaves ~5x headroom over that floor and is still ~10x below any wiring error
# (a wrong scale, q_norm order or rope theta shows up at >= 1e-1).
status = "calibrated"
basis_run = "tests/golden/qwen3-0-6b/0001"
greedy_tokens_exact = 64
layer_max_abs_diff = 1e-2
logits_max_abs_diff = 0.05
batch_sizes = [1, 2, 4]

[W2.bench]
# Calibrated 2026-11-01 against W2-0007 (paired arm W2-0005, both on this machine).
# Measured on W2-0007 (sdpa prefill / hand_baddbmm+slab decode, slab released with the request):
# ttft_cv 1.12%, tpot_cv 0.44%, memory 0.992 median (0.979 at the longest context), decode 1.013x.
# The W2-0006 calibration superseded here read 0.957 / 0.859: the slab hand-off fix flattened
# the memory ratio's dependence on context length, so the target is no longer at risk there.
# Targets stay put: they exist to catch drift, and the observed values sit inside them.
# Ratios are only meaningful against an arm measured on the same host: W2-0001's 16.78 ms and
# W2-0003's 1.113x came from a different 4090 instance and are not comparable (see W2-0005).
status = "calibrated"
basis_run = "W2-0007"
# CV is judged inside a length bucket (overall mixes 16..2048 token prompts).
ttft_cv_max = 0.10
tpot_cv_max = 0.10
# (weights + KV) / torch allocator peak, per context, judged on the median context.
# Not judged against the device-level number (torch.cuda.mem_get_info): it includes the CUDA
# context (~0.5 GB at this size) and spans the whole card, which no formula predicts, so the
# target would be unreachable by construction.
# The residual is activation workspace (T^2 attention) -- a property of the implementation,
# so long-context rows are reported next to the median instead of being averaged away.
memory_match_ratio = 0.90
# median over prompts of (baseline TPOT / our TPOT), matched by prompt id.
decode_speed_vs_hf_min = 0.80

[W3.continuous]
# Calibrated 2026-11-03 against W3-0011 (continuous B=8 mixed) vs W3-0010
# (static, same trace 33bc2397... and max_batch=8).
# Measured: C1 2.01x (311.43 / 154.94 tok/s), C2 decomposed pass (max 1.8e-12 ms),
# C3 request-row token_sha256 0 mismatch over 89 (prompt, budget) keys.
# Context: uniform pair W3-0008/0009 = 1.023x (P3 negative result, record-only);
# B=32 mixed pair W3-0012/0013 = 1.606x (record-only, below the 1.8-2.2x P4 band).
# Targets stay put: 1.30 is the pre-registered target; <1.20 is the negative line.
# Do not read the per-prompt TTFT/e2e CV warnings of saturated scenario runs as
# W2's 0.10 latency-CV target: R5 only looks at the trace-level tok_s CV, which
# was 0.11-0.53% here.
status = "calibrated"
basis_run = "W3-0011"
throughput_speedup_min = 1.30
ttft_p99_decomposed = true

[W4.paged]
# Calibrated 2026-11-06 against W4-0003 (capacity; baseline W4-0002) and W4-0005 (frag).
# Measured: C1 3.111x (28 vs 9, 800 blocks, kv_total 1601.97 MiB <= 1640);
# C2 internal frag 0.55% (target 5%); C3 40/40 E2 token ids identical + E0 64/64 golden.
# C4 is record-only and did NOT pass: paged decode step 35.63 ms vs seat 21.32 ms = 1.671x
# (>1.5x withdraws any throughput conclusion). E3 was later run post-hoc at the user's
# request as record-only: 0006 seat 333.44 tok/s vs 0008 paged 325.19 = 0.975x (both
# saturated; 0007 820 blocks was over budget and is kept only as an R5 record). That does
# not change C4. The C1 target stays 1.50: calibration records the observed point, it
# does not lower the pre-registered line.
status = "calibrated"
basis_run = "W4-0003"
max_concurrency_speedup_min = 1.50
fragmentation_max = 0.05

[W7.state]
status = "target"
basis_run = ""
state_estimate_error_max = 0.20
