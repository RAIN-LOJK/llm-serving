# C2 fineweb_cn 语料升级（配方不可变：改参数 = 新文件）
# 依据：语料 385 万字符 × 压缩率 0.607 ≈ 234 万 token（luxun 的 ~2 倍）
#   → 参数上限 ~3-6M（B3a 容量-语料匹配）；基线档 4L×128d 总参 ~2.8M
#   → 窗口 256→512 匹配长文档（平均 ~1500 token/篇）
# 预算：先定 3000，冒烟测速后按拐点方法调整
[data]
tokenizer_path = "datasets/fineweb_cn/tokenizer.json"
train_dir = "datasets/fineweb_cn/train"
val_dir = "datasets/fineweb_cn/val"
block_size = 512

[model]
n_embd = 128
n_head = 4
n_kv_head = 4        # = n_head 时 MHA；调小即 GQA/MQA 实验
n_layer = 4
n_inner = 0          # 0 = 默认 n_embd*4（toml 无 None，用 0 约定）
dropout = 0.0
bias = false
norm_eps = 1e-5
tie_word_embeddings = true

[train]
batch_size = 32
max_iters = 3000
warmup_steps = 150
lr = 3e-3
min_lr = 1e-4
accum_steps = 1
max_norm = 1.0        # 梯度裁剪上限；0 = 关闭裁剪（LLM 常用 1.0，其他任务可按需关）
log_interval = 50
eval_interval = 200
seed = 0

[weight]
directory = "weights"
name = "minillm.pth"
resume = false
resume_name = "resume.pt"
resume_interval = 200
