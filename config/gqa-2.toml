[data]
tokenizer_path = "datasets/luxun/tokenizer.json"
train_dir = "datasets/luxun/train"
val_dir = "datasets/luxun/val"
block_size = 256

[model]
n_embd = 128
n_head = 4
n_kv_head = 2
n_layer = 2
n_inner = 0
dropout = 0.0
bias = false
norm_eps = 1e-5
tie_word_embeddings = true

[train]
batch_size = 32
max_iters = 500
warmup_steps = 50
lr = 3e-3
min_lr = 1e-4
accum_steps = 1
max_norm = 1.0
log_interval = 50
eval_interval = 50
seed = 0

[weight]
directory = "weights"
name = "minillm.pth"
resume = false
resume_name = "resume.pt"
resume_interval = 500