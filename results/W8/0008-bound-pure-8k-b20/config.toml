# W8-0008 · 边界探针（pure 0.6B）：ctx 8192 / B=20 —— 8k×B=32 的 N/A 上界
# 口径见 docs/decisions.md D10 与 docs/w8-plan.md；正式 run 必须在干净树执行。
# 块数 = 20 × ceil((8192+128)/16) = 10400，留 10500（KV 池 ≈17.9 GiB）。
# 单独复跑同配置峰值 19.25 GiB（余 4.3 GiB）；B=32 光 KV 池就要 28.1 GiB > 24.5 GiB。
# 注意：8k 随机 synthetic prompt 上 0.6B 第 2 个 token 即 EOS（P-31 同类），
# 本 run 的 decode/TPOT 不可引用，只作「池 + 权重 + 单条 8k prefill」的内存上界。

schema = 1

[exp]
id = "W8-0008"
stage = "W8"
type = "scenario"
slug = "bound-pure-8k-b20"
title = "边界探针（pure 0.6B）：ctx 8192 / B=20（8k×B=32 不可行）"
hypothesis = ["pure_8k_b32_is_infeasible_and_b20_is_the_measured_bound"]
seed = 0

[[models]]
name = "Qwen/Qwen3-0.6B"
revision = "c1899de289a04d12100db370d81485cdf75e47ca"
dtype = "bfloat16"
trust_remote_code = false

[workload]
kind = "synthetic"
