# W7-0001 · E0b 正确性（hybrid）：8 条 mixed prompts / B=1 / 128 new
# W7 口径见 docs/w7-plan.md §5.1 run 矩阵 / §5.4 fill 旋钮 / §5.5 E3 / §5.6 E4 / §6 协议。
# 运行：python -m bench.run --config configs/experiments/W7/0001-e0b-hybrid-b1-mixed.toml
#
# 自包含：revision 已 pin；本文件不引用其它配置。正式 run 必须在干净树执行；
# 本目录只准备配置，不代表任何数字已经测到。

schema = 1

[exp]
id = "W7-0001"
stage = "W7"
type = "scenario"
slug = "e0b-hybrid-b1-mixed"
title = "E0b 正确性（hybrid）：8 条 mixed prompts / B=1 / 128 new"
hypothesis = ["hybrid_batch_decode_matches_the_per_request_order"]
seed = 0

[[models]]
name = "Qwen/Qwen3.5-0.8B"
revision = "2fc06364715b967f1860aea9cf38778875588b17"
dtype = "bfloat16"
trust_remote_code = false

[workload]
kind = "prompts"
prompts = "bench/prompts.json"
prompt_ids = ["s01", "s05", "m01", "m04", "m08", "l01", "l03", "l05"]
max_new_tokens = 128
arrival = "closed"
requests = 8
budgets = [128]
batch_sizes = [1]
shuffle = false

[scheduler]
policy = "continuous"

[engine]
impl = "hybrid"
device = "cuda"
max_batch = 1
pool = "paged"
linear_slots = 1
kv_blocks = 2048
block_size = 16
max_prefill_tokens = 8192

[measure]
warmup = 3
repeats = 5
timer = "auto"
memory = ["torch_peak", "driver"]

[accept]
# record_only：W7 阈值判定在 Step 5 用本 run 的 summary 求值（bench/thresholds.py），
# 不在正式 run 内自证；这样 Step 5 的口径/配对复核不会被 runner 抢先下结论。
# E0b 只核对逐请求 token id；B=1/0001 是参考，B=8/0002 必须与它逐 prompt 全等。
mode = "record_only"
criteria = []
