# W2-0006 · 固定注意力路径（本机配对）
# 与 W2-0004 同一代码路径，只改了一处：单一 slab（换桶即重建），见 commit ce0af17。
# 基线换成同机同会话的 W2-0005，而不是跨实例的 W2-0001。
# 运行：python -m bench.run --config configs/experiments/W2/0006-fixed-attn-path-paired.toml

schema = 1

[exp]
id = "W2-0006"
stage = "W2"
type = "microbench"
slug = "fixed-attn-path-paired"
title = "固定注意力路径：prefill=sdpa / decode=hand_baddbmm+slab（本机配对）"
hypothesis = ["one_attention_path_does_not_move_w2_numbers"]
supersedes = "W2-0004"
seed = 0

[[models]]
name = "Qwen/Qwen3-0.6B"
revision = "c1899de289a04d12100db370d81485cdf75e47ca"
dtype = "bfloat16"
trust_remote_code = false

[workload]
kind = "prompts"
prompts = "bench/prompts.json"
max_new_tokens = 128
batch_sizes = [1]
arrival = "closed"

[engine]
impl = "minillm"
device = "cuda"
max_batch = 1

[measure]
warmup = 3
repeats = 5
timer = "auto"
memory = ["torch_peak", "driver"]

[baseline]
run_id = "W2-0005"

[accept]
mode = "threshold"
criteria = ["ttft_cv_max", "tpot_cv_max", "memory_match_ratio", "decode_speed_vs_hf_min"]
