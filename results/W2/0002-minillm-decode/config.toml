# W2-0002 · 自实现解码器的 decode 速度（对 W2-0001 的配对臂）
# 运行：python -m bench.run --config configs/experiments/W2/0002-minillm-decode.toml
# 判据（ROADMAP §5 W2）：decode ≥ 0.8× HF；< 0.5× 必须在 notes.md 给瓶颈解释。
# 绝对值与 HF 分开报，只报比值（§6 口径：HF 与自实现数字不混用）。

schema = 1

[exp]
id = "W2-0002"
stage = "W2"
type = "microbench"
slug = "minillm-decode"
title = "自实现解码器：TTFT / TPOT @ 同一 prompt 集"
hypothesis = ["decode_speed_vs_hf"]
seed = 0

[[models]]
name = "Qwen/Qwen3-0.6B"
revision = "c1899de289a04d12100db370d81485cdf75e47ca"
dtype = "bfloat16"
trust_remote_code = false

[workload]
kind = "prompts"
prompts = "bench/prompts.json"
max_new_tokens = 128
batch_sizes = [1]
arrival = "closed"

[engine]
impl = "minillm"
device = "cuda"
max_batch = 1

[measure]
warmup = 3
repeats = 5
timer = "auto"
memory = ["torch_peak", "driver"]

[baseline]
run_id = "W2-0001"

[accept]
mode = "threshold"
criteria = ["ttft_cv_max", "tpot_cv_max", "memory_match_ratio", "decode_speed_vs_hf_min"]
