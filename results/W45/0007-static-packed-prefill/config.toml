# W45-0007 · E3 prefill 打包（packed 臂）：static B=8 mixed / 1 token
# W4.5 口径见 ROADMAP.md §5 W4.5。与 W45-0006 同 prompt / 同 trace / 同 max_batch，
# 只把 prefill 从逐请求改成 one varlen group；两臂共用同一 varlen 后端。
# 运行：python -m bench.run --config configs/experiments/W45/0007-static-packed.toml
#
# 判据（provisional，E0/E2 dry run 后冻结进 D7 / [W45.paged]）：
#   packed_prefill_ttft_p99_speedup_min = 1.15（serial p99 / packed p99）
#   packed_prefill_ttft_p50_ratio_max  = 1.10（packed p50 / serial p50）
# 注意：packed 可能让最早到的请求等整批，p50 变差、p99 变好；两个数都报，不挑。

schema = 1

[exp]
id = "W45-0007"
stage = "W45"
type = "scenario"
slug = "static-packed-prefill"
title = "E3 prefill A/B（packed）：static B=8 mixed / 1 token"
hypothesis = ["packed_prefill_improves_ttft_tail_without_p50_regression"]
seed = 0

[[models]]
name = "Qwen/Qwen3-0.6B"
revision = "c1899de289a04d12100db370d81485cdf75e47ca"
dtype = "bfloat16"
trust_remote_code = false

[workload]
kind = "prompts"
prompts = "bench/prompts.json"
prompt_ids = ["s01", "s05", "m01", "m04", "m08", "l01", "l03", "l05"]
max_new_tokens = 1
arrival = "closed"
requests = 8
budgets = [1]
batch_sizes = [1]

[scheduler]
policy = "static"

[engine]
impl = "continuous"
device = "cuda"
max_batch = 8
prefill = "packed"
max_prefill_tokens = 8192

[baseline]
run_id = "W45-0006"

[measure]
warmup = 1
repeats = 3
timer = "auto"
memory = ["torch_peak", "driver"]

[accept]
mode = "threshold"
criteria = ["packed_prefill_ttft_p99_speedup_min", "packed_prefill_ttft_p50_ratio_max"]
