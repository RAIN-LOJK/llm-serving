# W45-0001 · E0 数值门：paged + packed prefill + Triton decode / s01 贪心 64
# W4.5 口径见 ROADMAP.md §5 W4.5 与 docs/decisions.md D7（正式 run 前落地）。
# 运行：python -m bench.run --config configs/experiments/W45/0001-paged-packed-numeric-gate.toml
#
# 用途：E0c 端到端 golden。1 请求、64 token，核对新注意力路径
# （packed prefill 写块 + Triton block-table decode）与 tests/golden/qwen3-0-6b/0001
# 的 greedy_ids 逐 id 全等。runner 通过 [accept].golden 直接把匹配率写进 summary；
# 仍可用 `python scripts/check_paged_golden.py results/W45/0001-*` 复核。
# 门禁：64/64；不过先查 near-tie（fp32 oracle），不静默重生成 golden。
# 不跑任何性能 run，直到本 run 过。

schema = 1

[exp]
id = "W45-0001"
stage = "W45"
type = "microbench"
slug = "paged-packed-numeric-gate"
title = "E0 数值门：packed prefill + Triton decode 的 s01 64 token 与 golden 全等"
hypothesis = ["packed_prefill_and_block_table_decode_are_golden_equivalent"]
seed = 0

[[models]]
name = "Qwen/Qwen3-0.6B"
revision = "c1899de289a04d12100db370d81485cdf75e47ca"
dtype = "bfloat16"
trust_remote_code = false

[workload]
kind = "prompts"
prompts = "bench/prompts.json"
max_new_tokens = 64
arrival = "closed"
requests = 1
prompt_ids = ["s01"]
budgets = [64]
batch_sizes = [1]

[scheduler]
policy = "continuous"

[engine]
impl = "paged"
device = "cuda"
max_batch = 1
block_size = 16
kv_blocks = 64
prefill = "packed"
max_prefill_tokens = 8192
decode = "triton"

[measure]
warmup = 0
repeats = 1
timer = "auto"
memory = ["torch_peak", "driver"]

[accept]
mode = "threshold"
criteria = ["golden_token_match_min"]
golden = "tests/golden/qwen3-0-6b/0001"
